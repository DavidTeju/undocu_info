name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    env:
      # Public env vars needed for SvelteKit type checking
      PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
      PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key'
      PUBLIC_FILES_ROOT: 'https://placeholder.supabase.co'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run check

  deploy:
    name: Deploy to VPS
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/undocu_info
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            cd app
            read_env() {
              value="$(grep -m1 "^$1=" .env | cut -d= -f2-)"
              value="${value%\"}"
              value="${value#\"}"
              value="${value%\'}"
              value="${value#\'}"
              printf '%s' "$value"
            }
            PUBLIC_SUPABASE_URL="$(read_env PUBLIC_SUPABASE_URL)"
            PUBLIC_SUPABASE_ANON_KEY="$(read_env PUBLIC_SUPABASE_ANON_KEY)"
            PUBLIC_FILES_ROOT="$(read_env PUBLIC_FILES_ROOT)"
            test -n "$PUBLIC_SUPABASE_URL"
            test -n "$PUBLIC_SUPABASE_ANON_KEY"
            test -n "$PUBLIC_FILES_ROOT"
            docker build \
              --build-arg PUBLIC_SUPABASE_URL="$PUBLIC_SUPABASE_URL" \
              --build-arg PUBLIC_SUPABASE_ANON_KEY="$PUBLIC_SUPABASE_ANON_KEY" \
              --build-arg PUBLIC_FILES_ROOT="$PUBLIC_FILES_ROOT" \
              -t undocu_app .
            docker rm -f undocu_app 2>/dev/null || true
            docker run -d \
              --name undocu_app \
              --network supabase_default \
              --env-file .env \
              -p 127.0.0.1:4173:4173 \
              --restart unless-stopped \
              undocu_app
            docker image prune -f
