name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    env:
      # Public env vars needed for SvelteKit type checking
      PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
      PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key'
      PUBLIC_FILES_ROOT: 'https://placeholder.supabase.co'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run check

  image:
    name: Build image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: true
          tags: ghcr.io/davidteju/undocu_info:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # Public values: they ship in the browser bundle anyway.
          build-args: |
            PUBLIC_SUPABASE_URL=${{ vars.PUBLIC_SUPABASE_URL }}
            PUBLIC_SUPABASE_ANON_KEY=${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
            PUBLIC_FILES_ROOT=${{ vars.PUBLIC_FILES_ROOT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: image
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      packages: read
    steps:
      # The key's forced command on the VPS can only run `deploy-app undocustudent stage|deploy
      # <sha>`. The job token, which can pull this image until the job ends, goes on stdin.
      - name: Deploy through the restricted key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "deploy@$HOST" "deploy $GITHUB_SHA"
