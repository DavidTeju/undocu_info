<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Verification Code</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #FBF5F2; margin: 0; padding: 40px 20px;">
  <div style="max-width: 400px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
    <h1 style="margin: 0 0 16px 0; font-size: 20px; font-weight: 600; color: #272838; text-align: center;">
      Your Verification Code
    </h1>
    <p style="margin: 0 0 24px 0; font-size: 14px; color: #555; text-align: center; line-height: 1.5;">
      Enter this code to verify your email and suggest edits:
    </p>
    <div style="background-color: #f5f5f5; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 24px;">
      <span style="font-size: 32px; font-weight: 600; letter-spacing: 8px; color: #272838; font-family: monospace;">
        {{ .Token }}
      </span>
    </div>
    <p style="margin: 0; font-size: 12px; color: #888; text-align: center;">
      This code expires in 1 hour. If you didn't request this, you can ignore this email.
    </p>
  </div>
</body>
</html>
